<div class="register-layout__page">
  <p class="register-layout__title">Crear cuenta</p>
  <p class="register-layout__instruction">
    Para que puedas iniciar sesión de forma rápida y segura, crearemos un <strong>Passkey</strong> vinculado a tu dispositivo. Este método es más seguro que una contraseña tradicional.
  </p>
  <img src="images/passkey.svg" alt="Passkey" class="register-layout__image" />
  <div class="register-layout__buttons">
    <button type="button" class="button button-primary" (click)="startPasskeyRegistration()">
      Siguiente
    </button>
  </div>
</div>
